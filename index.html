<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Nova – Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#10261C;--bg2:#0B1C14;--line:rgba(246,241,231,.14);--text:#F6F1E7;--muted:#B9C6BE;--gold:#E9C46A;--red:#B3242E;--sky:#E7EEF2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:Manrope,system-ui,sans-serif;color:var(--text)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;cursor:pointer}
.card{background:rgba(16,38,28,.94);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(16,38,28,.25);border-radius:18px}
#top{position:fixed;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#brand{padding:12px 16px;display:flex;align-items:center;gap:12px}
#brand .logo{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center}
#brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800}
#brand b{font-family:Fraunces,serif;font-weight:600;font-size:19px;display:block;line-height:1.1}
#status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
#status i{width:7px;height:7px;border-radius:50%;background:#9AA5A0;display:inline-block}
#status.live i{background:#2FB45A}
#kpis{display:flex;gap:8px}
.kpi{padding:10px 14px;min-width:96px}
.kpi b{display:block;font-family:Fraunces,serif;font-size:21px;color:var(--gold);line-height:1.1}
.kpi span{font-size:11px;color:var(--muted)}
#alert{position:fixed;right:16px;top:92px;width:300px;background:var(--red);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(120,20,30,.3);z-index:5}
#alert b{display:block;font-size:16px;margin-bottom:4px}
#alert p{margin:0 0 12px;font-size:13px;color:#FBE9E9;line-height:1.45}
.btn{border:0;border-radius:999px;padding:0 16px;min-height:42px;font-weight:800;background:#fff;color:#8A2028;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:#10261C}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:focus-visible,.dk:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;padding:8px 10px 6px;z-index:6;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dk{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--text);padding:4px 4px 2px;border-radius:14px;width:58px;position:relative;transition:transform .15s ease}
.dk:hover{transform:translateY(-3px)}
.dk.on{background:rgba(246,241,231,.12)}
.dk .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dk .ic svg{width:20px;height:20px}
.dk span{font-size:10px;font-weight:700;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis;color:#DDE5E0}
.dk .dot{position:absolute;top:2px;right:8px;width:9px;height:9px;border-radius:50%;background:#9AA5A0;border:2px solid #10261C}
.dk .dot.on{background:#2FB45A}
.dk .badge{position:absolute;top:0;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;border:2px solid #10261C}
.sep{width:1px;height:40px;background:var(--line);flex:none;margin:0 6px 8px}
#team{position:fixed;left:16px;top:96px;max-height:calc(100% - 200px);width:268px;z-index:5;display:flex;flex-direction:column;padding:12px 10px 10px}
#team .th{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
#team .th b{font-size:13px;letter-spacing:.14em;color:var(--gold)}
#team .th span{font-size:11px;color:var(--muted)}
#teamList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.tm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:8px;border-radius:14px;min-height:54px;transition:background .15s}
.tm:hover{background:rgba(246,241,231,.07)}
.tm.on{background:rgba(233,196,106,.16);box-shadow:inset 0 0 0 1px rgba(233,196,106,.5)}
.tm:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.tm .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tm .av i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:#9AA5A0;border:2px solid #10261C}
.tm .av i.on{background:#2FB45A}
.tm .tx{min-width:0;flex:1}
.tm .tx b{display:block;font-size:14px;line-height:1.2}
.tm .tx small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .tx em{font-style:normal;color:#CFE8D6}
.tm .go{color:var(--muted);font-size:16px;flex:none}
#teamBtn{display:none}
#zoom{position:fixed;right:16px;bottom:100px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:44px;height:44px;border-radius:14px;border:0;background:rgba(16,38,28,.92);color:#fff;font-size:20px;font-weight:700}
#side{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);background:var(--bg);z-index:8;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.25)}
#side.open{transform:none}
#side header{display:flex;align-items:center;gap:12px;padding:18px 16px 14px 18px;border-bottom:1px solid var(--line)}
#sideAv{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
#side h2{margin:0;font-size:19px}
#side header small{color:var(--muted);font-size:12px}
.x{margin-left:auto;background:rgba(246,241,231,.08);border:0;color:var(--text);border-radius:12px;min-width:44px;min-height:44px;font-size:18px}
#sideBody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#sideFoot{padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#sideFoot:empty{display:none}
.kick{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--gold)}
.rep{background:rgba(246,241,231,.05);border-radius:14px;padding:12px 14px}
.rep h4{margin:0 0 3px;font-size:14px}
.rep small{color:var(--muted);font-size:11px}
.rep div{white-space:pre-wrap;font-size:13px;color:#D5DED7;margin-top:6px;line-height:1.5}
.empty{color:var(--muted);font-size:13px;margin:0}
textarea,input,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(246,241,231,.05);font-size:14px}
ul.list li span{flex:1;min-width:0}
ul.list li.done span{text-decoration:line-through;color:var(--muted)}
ul.list small{color:var(--muted)}
input[type=checkbox]{width:22px;height:22px;min-height:auto;flex:none;accent-color:var(--gold)}
.mini{background:none;border:0;color:var(--muted);font-size:12px;min-height:36px;padding:0 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(246,241,231,.05);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:24px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.stage h4{margin:4px 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.stage h4 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cli{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:rgba(246,241,231,.05);border:0;color:var(--text);border-radius:12px;padding:10px 12px;min-height:48px;margin-bottom:6px}
.cli small{color:var(--muted)}
.lbl{font-size:12px;color:var(--muted)}
dialog{background:var(--bg);color:var(--text);border:0;border-radius:20px;padding:20px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,15,.55)}
dialog form{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#10261C;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:20;transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
#hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);font-size:12px;color:#3C4B44;background:rgba(255,255,255,.75);padding:6px 12px;border-radius:999px;z-index:4;pointer-events:none;transition:opacity .5s}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--gold);color:#10261C;border-bottom-right-radius:6px}
.msg.boss{align-self:flex-start;background:rgba(246,241,231,.08);color:#E6ECE8;border-bottom-left-radius:6px}
.msg.err{align-self:flex-start;background:rgba(179,36,46,.25);color:#FBE9E9}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:0 12px;min-height:38px;font-size:13px;font-weight:700}
.chip:hover{background:rgba(246,241,231,.08)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default}
#bossBtn{margin-top:8px;width:100%;background:#22313F;color:#F6F1E7}
body.side-open #dock{left:calc((100vw - 420px)/2)}
body.side-open #zoom{right:436px}
@media (max-width:1100px){#alert{top:auto;bottom:100px}}
@media (max-width:760px){#team{display:none;top:84px;left:12px;right:12px;width:auto;bottom:100px;z-index:7}body.team-open #team{display:flex}#teamBtn{display:flex}body.side-open #dock{left:50%}body.side-open #zoom{right:12px}#side{height:calc(100% - 96px)}#kpis{display:none}#alert{top:auto;bottom:98px;left:12px;width:calc(100vw - 24px)}#hint{display:none}#zoom{bottom:auto;top:84px;right:12px}}
@media (prefers-reduced-motion:reduce){#side,.dk{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Oficina de los agentes de Nova. Usá la barra de abajo para abrir cada agente."></canvas>

<div id="top">
  <div id="brand" class="card">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 34 34"><path d="M17 4l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#10261C"/></svg></div>
    <div><small>NOVA MARKETING ESTUDIO</small><b>La oficina</b><div id="status"><i></i><span>Conectando…</span></div></div>
  </div>
  <div id="kpis">
    <div class="kpi card"><b id="kSem">$0</b><span>esta semana</span></div>
    <div class="kpi card"><b id="kCob">$0</b><span>por cobrar</span></div>
    <div class="kpi card"><b id="kCli">0</b><span>clientes activos</span></div>
  </div>
</div>

<div id="alert" role="status">
  <b id="alertTitle">Cargando…</b>
  <p id="alertText">Conectando con tus datos.</p>
  <button class="btn" type="button" id="alertBtn">Ver lo que te toca</button>
  <button class="btn" type="button" id="bossBtn">Hablar con Don Nova</button>
</div>

<section id="team" class="card" aria-labelledby="teamTitle">
  <div class="th"><b id="teamTitle">EQUIPO</b><span id="teamCount">11 agentes</span></div>
  <div id="teamList"></div>
</section>
<div id="zoom" aria-label="Zoom">
  <button type="button" id="zIn" aria-label="Acercar">+</button>
  <button type="button" id="zOut" aria-label="Alejar">−</button>
  <button type="button" id="zHome" aria-label="Ver toda la oficina" style="font-size:14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
</div>
<div id="hint">Tocá un agente para ver su trabajo · arrastrá para moverte</div>

<nav id="dock" class="card" aria-label="Agentes y secciones"></nav>

<aside id="side" aria-labelledby="sideTitle" aria-hidden="true">
  <header>
    <div id="sideAv"></div>
    <div style="min-width:0"><h2 id="sideTitle">Agente</h2><small id="sideSub"></small></div>
    <button class="x" type="button" id="sideClose" aria-label="Cerrar panel">✕</button>
  </header>
  <div id="sideBody"></div>
  <div id="sideFoot"></div>
</aside>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="fCli">
    <h2 id="dlgTitle" style="margin:0 0 4px;font-size:18px">Cliente</h2>
    <label class="lbl" for="cNombre">Negocio</label><input id="cNombre" required>
    <label class="lbl" for="cContacto">Contacto</label><input id="cContacto">
    <div class="row">
      <div><label class="lbl" for="cEtapa">Sala</label><select id="cEtapa"></select></div>
      <div><label class="lbl" for="cMonto">Monto US$</label><input id="cMonto" type="number" min="0" step="0.01"></div>
    </div>
    <label class="lbl" for="cServicio">Servicio</label><input id="cServicio">
    <label class="lbl" for="cNotas">Notas</label><textarea id="cNotas"></textarea>
    <div class="row" style="margin-top:6px">
      <button class="btn gold" type="submit">Guardar</button>
      <button class="btn ghost" type="button" id="cCancel">Cancelar</button>
      <button class="btn ghost" type="button" id="cDel">Borrar</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const ETAPAS=[["nuevo","Nuevos","#7DB8F0"],["contactado","Contactados","#7BD389"],["propuesta","Propuesta","#E9C46A"],["aprobado","Aprobados","#F4A261"],["pagado","Pagados","#3BB273"],["descartado","Descartados","#9AA5A0"]];
// key, nombre, rol, horario, camisa, piel, pelo
const AG=[
 ["clientes","Clara","Clientes","Lunes","#3D7BD9","#F1C9A5","#3B2416"],
 ["pendientes","Pablo","Pendientes","Lun y jue","#E07A2E","#C68B5E","#1E1E1E"],
 ["ingresos","Inés","Caja semanal","Domingos","#2E8B57","#F3D2B3","#8A4B21"],
 ["prospectos","Rafa","Prospectos","Martes","#C8323C","#A86F45","#1E1E1E"],
 ["redes","Vale","Redes sociales","Lunes","#D65DB1","#F1C9A5","#E0B04A"],
 ["finanzas","Fede","Finanzas","Domingos","#556B82","#E8BE98","#5A3A22"],
 ["catalogo","Cata","Catálogo Nova","Miércoles","#8E5BD9","#C68B5E","#2B1A10"],
 ["radar","Iván","Radar IA","Lun, mié, vie","#1FA2A6","#F3D2B3","#1E1E1E"],
 ["shopify","Sofi","Shopify J&F","Diario","#5E9E3A","#A86F45","#3B2416"],
 ["jefe","Don Nova","Jefe","Domingos","#22313F","#E8BE98","#B8B8B8"],
 ["carpeta","Paul","Carpeta Nova","Cuando le pedís","#C77D2E","#C68B5E","#1E1E1E"]
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(Math.round((Number(n)||0)*100)/100).toLocaleString("es-NI");
let db=null,clientes=[],pend=[],ing=[],reps=[],notas=[],editing=null,current=null;

/* ================== DATOS ================== */
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function lastRep(k){return reps.find(r=>r.agente===k)}
function ago(iso){if(!iso)return"sin reportes todavía";const s=(Date.now()-new Date(iso))/1000;if(s<3600)return"hace "+Math.max(1,Math.round(s/60))+" min";if(s<86400)return"hace "+Math.round(s/3600)+" h";return"hace "+Math.round(s/86400)+" días"}
function active(k){if(k==="carpeta")return true;const r=lastRep(k);return !!(r&&(Date.now()-new Date(r.fecha))<86400000*1.2)}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
async function write(fn,ok){if(!db){toast("Sin conexión con los datos");return}try{await fn();if(ok)toast(ok)}catch(e){toast(e&&e.code==="invalid_argument"?"Solo el dueño puede cambiar datos":"No se pudo guardar")}}
function sums(){const ws=weekStart(),now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),1);let w=0,m=0;
 ing.forEach(x=>{const d=new Date((x.fecha||"")+"T12:00:00");if(d>=ws)w+=Number(x.monto)||0;if(d>=ms)m+=Number(x.monto)||0});
 const cob=clientes.filter(c=>c.etapa==="aprobado").reduce((a,c)=>a+(Number(c.monto)||0),0);
 const act=clientes.filter(c=>!["pagado","descartado"].includes(c.etapa)).length;return {w,m,cob,act}}
function renderTop(){
 const s=sums();$("kSem").textContent=money(s.w);$("kCob").textContent=money(s.cob);$("kCli").textContent=s.act;
 const open=pend.filter(p=>!p.hecho).length;const aprob=clientes.filter(c=>c.etapa==="aprobado");const nuevos=clientes.filter(c=>c.etapa==="nuevo").length;
 $("alertTitle").textContent=open?("Te tocan "+open+(open===1?" cosa":" cosas")):"Todo al día";
 const parts=[];if(aprob.length)parts.push("cobrarle a "+aprob.map(c=>c.nombre).slice(0,2).join(" y "));if(nuevos)parts.push(nuevos+" prospectos por contactar");
 $("alertText").textContent=parts.length?("Hoy: "+parts.join(" y ")+"."):"Tocá un agente para ver su último trabajo.";
 const b=document.querySelector("#dk-tareas .badge");if(b){b.textContent=open;b.hidden=!open}
renderTeam();
}

/* ================== DOCK ================== */
const ICON={
 folder:'<svg viewBox="0 0 24 24" fill="none" stroke="#10261C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="#10261C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
 cli:'<svg viewBox="0 0 24 24" fill="none" stroke="#10261C" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',

const REGLAS="Sos Don Nova, el jefe del equipo de agentes de Nova Marketing Estudio, el negocio de páginas web, videos y marketing de José Rafael Castellón en Nicaragua. Tu equipo (clave entre corchetes): Clara [clientes], Pablo [pendientes], Inés [ingresos], Rafa [prospectos], Vale [redes], Fede [finanzas], Cata [catalogo], Iván [radar], Sofi [shopify], y Paul, que cuida la carpeta de archivos y enlaces de Nova (si José pide un archivo o enlace, dáselo de la lista CARPETA o mandalo con Paul). José te habla desde su oficina y vos actuás por él.\n\nCómo hablás: español nicaragüense con voseo, directo y cálido, sin tecnicismos y sin emojis nunca. Breve (máximo 150 palabras) salvo que José pida el trabajo completo de un agente: ahí dáselo entero y ordenado.\n\nQué podés hacer con tus herramientas:\n- leer_reportes: traer completo lo que entregó un agente (prospectos, guiones, precios, etc.). Usala siempre que José pida algo específico de un empleado.\n- correr_agente: poner a trabajar a un agente AHORA con un pedido concreto. José confirma en pantalla antes. El resultado llega a su panel en unos minutos, no al instante.\n- mandar_mensaje: dejarle una indicación a un agente para su próxima corrida.\n- agregar_pendiente, actualizar_cliente, registrar_ingreso: cambiar los datos de la oficina cuando José lo pida claramente.\nSi lo que José pide ya está en un reporte, dáselo de una vez; si no existe, ofrecé correr al agente. Basate solo en los datos y en lo que devuelven las herramientas: no inventes cifras, clientes ni resultados. Nunca registres ingresos ni cambies clientes sin que José lo haya pedido en su mensaje. Cuando hagás un cambio, decí en una línea qué hiciste.";

function tools(){return [

const timer=setTimeout(()=>setStatus("No se pudieron cargar los datos"),10000);
function sub(q,set){return q.onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));if(!s.metadata.fromCache){clearTimeout(timer);setStatus("En vivo",true)}onData()},()=>{clearTimeout(timer);setStatus("Sin conexión con los datos")})}
(async()=>{
 if(!window.claude||!claude.use){clearTimeout(timer);setStatus("Abrí esta página desde Claude");return}
 db=await claude.use("db");if(!db){clearTimeout(timer);setStatus("Datos no disponibles aquí");return}
 sub(db.collection("clientes"),v=>clientes=v);sub(db.collection("pendientes"),v=>pend=v);sub(db.collection("ingresos"),v=>ing=v);
 sub(db.collection("reportes").orderBy("fecha","desc").limit(200),v=>reps=v);sub(db.collection("instrucciones"),v=>notas=v);sub(db.collection("carpeta"),v=>carpeta=v);sub(db.collection("chat_paul").orderBy("fecha","desc").limit(40),v=>paulDocs=v);sub(db.collection("chat_donnova").orderBy("fecha","desc").limit(40),v=>chatDocs=v);
})();
